# Сборка игры и публикация на GitHub Pages.
#
# Зачем через сборку, а не просто отдать файлы: игра пишется в модулях и
# собирается Vite в папку dist, которой в репозитории нет и быть не должно —
# это результат, а не исходник. Поэтому GitHub собирает её у себя при каждой
# отправке и кладёт результат на страницу.
#
# Запускается сам после отправки в main. Это не противоречит правилу «ничего
# не уходит без спроса»: отправку делаю я и только по вашему слову, а страница
# просто перестаёт отставать от репозитория. Кнопка ручного запуска тоже есть.

name: Выложить игру

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права ровно те, что нужны для публикации, и ни одного лишнего.
permissions:
  contents: read
  pages: write
  id-token: write

# Две отправки подряд не должны публиковаться наперегонки: побеждает свежая.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Собрать
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Полная история нужна ради номера коммита: он зашивается в сборку и
        # уходит со статистикой, иначе не сравнить «до» и «после».
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Шага configure-pages здесь нет нарочно. Он умеет включать страницу
      # сам, но прав на это у сборки нет, и она падала на нём целиком. А для
      # путей он не нужен: в vite.config.js стоит base './', то есть игра
      # ссылается на свои файлы относительно себя и работает из любой папки.
      #
      # Взамен страницу надо один раз включить руками:
      # Settings → Pages → Source: GitHub Actions.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Опубликовать
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      # Имя шага только латиницей: кириллические идентификаторы GitHub не
      # принимает и отказывается разбирать весь файл целиком.
      - id: page
        uses: actions/deploy-pages@v4
